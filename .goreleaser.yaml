# GoReleaser configuration for dumber browser
# https://goreleaser.com
version: 2

# Releases are published on ermite. In CI the runner sets GITHUB_API_URL and
# GITHUB_SERVER_URL to an address the job can reach; the public URLs are the
# fallback for a local run. The release workflow also runs on the GitHub
# mirror, so older builds, whose updater only reads GitHub, still update:
# there GoReleaser keeps its github.com defaults.
github_urls:
  api: '{{ if eq (index .Env "GITHUB_SERVER_URL") "https://github.com" }}https://api.github.com{{ else }}{{ or (index .Env "GITHUB_API_URL") "https://git.bnema.dev/-/github/api" }}{{ end }}/'
  upload: '{{ if eq (index .Env "GITHUB_SERVER_URL") "https://github.com" }}https://uploads.github.com{{ else }}{{ or (index .Env "GITHUB_API_URL") "https://git.bnema.dev/-/github/api" }}/uploads{{ end }}/'
  download: '{{ or (index .Env "GITHUB_SERVER_URL") "https://git.bnema.dev" }}/'

before:
  hooks:
    # Build and verify systemviews assets before building binaries
    - make build-systemviews
    - make verify-systemviews-assets

builds:
  # Pure Go build (no CGO required)
  - id: dumber
    main: ./cmd/dumber
    binary: dumber

    env:
      - CGO_ENABLED=0

    goos:
      - linux

    goarch:
      - amd64

    # Version information via ldflags (matching your Makefile)
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    wrap_in_directory: "{{ .ProjectName }}_{{ .Version }}"
    format_overrides:
      - goos: linux
        formats: ['tar.gz']
    files:
      - LICENSE
      - README.md
      - src: flatpak/dev.bnema.Dumber.desktop
        dst: .
        strip_parent: true
      - src: assets/logo-512.png
        dst: .
        strip_parent: true

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build\(deps\):'
      - 'Merge pull request'
      - 'Merge branch'
  groups:
    - title: 'Features'
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: 'Performance'
      regexp: '^perf(\(.+\))?:'
      order: 2
    - title: 'Refactoring'
      regexp: '^refactor(\(.+\))?:'
      order: 3
    - title: 'Documentation'
      regexp: '^docs(\(.+\))?:'
      order: 4
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: bnema
    name: dumber

  # Don't auto-publish as draft initially
  draft: false

  # Replace existing draft if it exists
  replace_existing_draft: true

  # Header for release notes
  header: |
    ## {{.Tag}} Release (amd64 Linux)

    Released on {{.Date}}

  # Footer with installation instructions
  footer: |
    ---

    ## Installation

    ### Linux (x86_64/amd64)
    ```bash
    # Download latest release
    wget https://git.bnema.dev/dumber/releases/latest/download/dumber_linux_x86_64.tar.gz

    # Extract and install to ~/.local/bin (enables auto-updates)
    tar -xzf dumber_linux_x86_64.tar.gz
    mkdir -p ~/.local/bin
    install -m 755 dumber_*/dumber ~/.local/bin/

    # Ensure ~/.local/bin is in your PATH (add to ~/.bashrc or ~/.zshrc if needed)
    # export PATH="$HOME/.local/bin:$PATH"
    ```

    ### Dependencies

    **Arch Linux:**
    ```bash
    # Core CEF, WebKit fallback, and GTK4
    sudo pacman -S cef webkitgtk-6.0 gtk4

    # GStreamer for WebKit media playback
    sudo pacman -S gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav gst-plugin-pipewire pipewire pipewire-pulse

    # Optional CEF build with VA-API hardware video decoding
    # paru -S cef-vaapi

    # Hardware acceleration drivers (choose based on your GPU)
    # AMD: sudo pacman -S mesa
    # NVIDIA: sudo pacman -S libva-nvidia-driver
    # Intel: sudo pacman -S libva-intel-driver intel-media-driver
    ```

    **Debian/Ubuntu:**
    ```bash
    # GTK4 and WebKit fallback
    sudo apt install libwebkitgtk-6.0-4 libgtk-4-1

    # GStreamer for media playback
    sudo apt install gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pipewire

    # Hardware acceleration
    sudo apt install gstreamer1.0-vaapi va-driver-all
    ```

  # Auto-detect prerelease from version (v1.0.0-rc1, v1.0.0-alpha, etc.)
  prerelease: auto

  # Mark as latest release
  make_latest: true

  # Replace existing release notes
  mode: replace

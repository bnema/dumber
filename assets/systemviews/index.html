<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>systemviews</title>
  <link rel="stylesheet" href="./systemviews.css">
  <script src="./wasm_exec.js"></script>
  <script>
    // One terminal-error guard: the loading shell reports its first fatal
    // failure exactly once. Streaming fallback noise stays console-only.
    let terminalErrorReported = false;
    function renderWasmError(prefixText, err) {
      console.error(prefixText, err);
      if (terminalErrorReported) return;
      terminalErrorReported = true;
      const render = () => {
        const app = document.getElementById('app');
        if (!app) return;
        // innerHTML replacement alone does not clear outer state: drop
        // the busy flag so assistive tech leaves the loading state.
        app.removeAttribute('aria-busy');
        app.setAttribute('data-failed', 'true');
        app.innerHTML = '';
        const message = document.createElement('div');
        message.className = 'sv-error';
        const prefix = document.createElement('span');
        prefix.textContent = prefixText;
        const details = document.createElement('span');
        details.textContent = err && err.message ? err.message : String(err || 'unsupported browser');
        message.append(prefix, details);
        app.append(message);
      };
      if (document.readyState === 'loading' && !document.getElementById('app')) {
        document.addEventListener('DOMContentLoaded', render, { once: true });
      } else {
        render();
      }
    }

    // Fetch exactly once: retain a clone for byte fallback before streaming
    // starts, so a streaming failure never issues a second fetch. An
    // unsuccessful status fails fast without consuming the body.
    function instantiateWasm(go, wasmURL) {
      const instantiateFromBytes = (bytes) => WebAssembly.instantiate(bytes, go.importObject);

      if (!WebAssembly.instantiateStreaming) {
        return fetch(wasmURL)
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP ${response.status} loading ${wasmURL}`);
            }
            return response.arrayBuffer();
          })
          .then(instantiateFromBytes);
      }
      let fallback = null;
      return fetch(wasmURL)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status} loading ${wasmURL}`);
          }
          fallback = response.clone();
          return WebAssembly.instantiateStreaming(response, go.importObject);
        })
        .catch((err) => {
          if (!fallback) throw err;
          console.error(`Streaming WebAssembly load failed for ${wasmURL}; falling back to ArrayBuffer instantiation`, err);
          return fallback.arrayBuffer().then(instantiateFromBytes);
        });
    }

    if (typeof WebAssembly !== 'object') {
      renderWasmError('WebAssembly is not supported in this browser: ');
    } else if (typeof Go !== 'function') {
      renderWasmError('Go WebAssembly runtime failed to load: ');
    } else {
      const go = new Go();
      // Record the runtime exit code: wasm_exec.js routes runtime.wasmExit
      // through go.exit, whose default only logs. Reporting the actual
      // status beats the misleading generic suffix on unexpected exits.
      let goExitCode = null;
      const goExit = go.exit.bind(go);
      go.exit = (code) => {
        goExitCode = code;
        goExit(code);
      };
      instantiateWasm(go, './systemviews.wasm')
        // The runtime stays alive: a resolved go.run means main returned
        // instead of serving, which is itself a terminal failure.
        .then((result) => go.run(result.instance))
        .then(
          () => {
            // Go renders fatal mount/bind failures itself and marks
            // data-failed: never overwrite its terminal state here.
            const app = document.getElementById('app');
            if (app && app.dataset && app.dataset.failed) return;
            const code = goExitCode === null ? 'unknown' : String(goExitCode);
            renderWasmError('systemviews runtime exited: ', new Error(`exit status ${code}`));
          },
          (err) => renderWasmError('Failed to load systemviews WebAssembly: ', err),
        );
    }
  </script>
</head>
<body>
  <main id="app" aria-busy="true">Loading systemviews…</main>
  <noscript>
    <p>JavaScript is required to run Dumber system views. Enable JavaScript for <code>dumb://history</code>, <code>dumb://favorites</code>, and <code>dumb://config</code>.</p>
  </noscript>
</body>
</html>
